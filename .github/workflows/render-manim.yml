name: Render Manim mathematics

on:
  push:
    branches: [main]
    paths:
      - "manim/**"
      - ".github/workflows/render-manim.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manim-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev build-essential texlive-latex-extra texlive-fonts-recommended dvisvgm

      - name: Install Manim
        run: python -m pip install --upgrade pip manim

      - name: Render 4K 60 FPS animations and validate outputs
        run: |
          set -euo pipefail
          mkdir -p assets/manim
          render_and_publish() {
            local source="$1"
            local scene="$2"
            local slug="$3"
            local video="media/videos/${source}/2160p60/${scene}.mp4"
            echo "Rendering ${scene} in 4K / 60 FPS"
            manim -qk --fps 60 --format mp4 "manim/${source}.py" "${scene}"
            test -s "${video}"
            local duration
            duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "${video}")
            echo "${slug}: ${duration}s"
            awk -v duration="${duration}" 'BEGIN { exit !(duration > 8) }'
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 "${video}"
            cp "${video}" "assets/manim/${slug}.mp4"
            test -s "assets/manim/${slug}.mp4"
          }
          render_and_publish euler EulerHelix euler_helix
          render_and_publish concepts DerivativeTangent derivative_tangent
          render_and_publish concepts FourierSquareWave fourier_square
          render_and_publish concepts RiemannIntegral riemann_integral

      - name: Publish rendered videos to Pages source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/manim/*.mp4
          if git diff --cached --quiet; then
            echo "No video changes."
            exit 0
          fi
          git commit -m "Publish 4K Manim learning animations [skip ci]"
          git push origin HEAD:main
