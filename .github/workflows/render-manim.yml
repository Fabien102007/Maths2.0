name: Render Manim mathematics

on:
  push:
    branches: [main]
    paths:
      - "manim/**"
      - ".github/workflows/render-manim.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manim-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev build-essential texlive-latex-extra texlive-fonts-recommended dvisvgm

      - name: Install Manim
        run: python -m pip install --upgrade pip manim

      - name: Render 1080p 60 FPS animation
        run: |
          manim -qh --fps 60 --format mp4 manim/euler.py EulerHelix
          mkdir -p assets/manim
          find media/videos -type f -name "*.mp4" -print -quit | xargs -I{} cp "{}" assets/manim/euler_helix.mp4
          test -s assets/manim/euler_helix.mp4

      - name: Publish rendered video to Pages source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/manim/euler_helix.mp4
          if git diff --cached --quiet; then
            echo "No video changes."
            exit 0
          fi
          git commit -m "Publish rendered Manim animation [skip ci]"
          git push origin HEAD:main
